[package]
name = "assembly-poll"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.2", features = ["full"] }
axum = {version = "0.8.4", features=["ws"]}
futures = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
headers = "0.4.2"
rand = "0.10.3"
axum-extra = { version = "0.12.6", features = ["cookie"] }
cookie = "0.18.2"
serde_json = "1.0.151"
